name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.25"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage gate
        run: |
          # Fail if total statement coverage drops below the floor.
          # Raise the floor as coverage improves; never lower it.
          FLOOR=55.0
          TOTAL=$(go tool cover -func=coverage.out | tail -1 | awk '{sub(/%/,"",$3); print $3}')
          echo "total coverage: ${TOTAL}% (floor: ${FLOOR}%)"
          awk -v t="$TOTAL" -v f="$FLOOR" 'BEGIN { exit (t+0 < f+0) ? 1 : 0 }'

      - name: Upload coverage
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          LDFLAGS="-X osg/internal/app.Version=${VERSION} -X osg/internal/app.Commit=${COMMIT} -X osg/internal/app.Date=${DATE}"
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          BINARY="osg-${GOOS}-${GOARCH}${EXT}"
          go build -ldflags "${LDFLAGS}" -o "build/${BINARY}" ./cmd/osg
          cd build && tar czf "${BINARY}.tar.gz" "${BINARY}"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: osg-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build/*.tar.gz

  build-plugins:
    name: Build Plugins
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('plugins-src/**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build WASM plugins
        run: |
          mkdir -p build/plugins
          for dir in plugins-src/*/; do
            name=$(basename "$dir")
            echo "=== Building plugin: ${name} ==="
            cd "$dir"
            TARGET="wasm32-wasip1"
            cargo build --target "$TARGET" --release
            # Find the .wasm output (crate name may use underscores)
            wasm=$(find "target/$TARGET/release" -maxdepth 1 -name '*.wasm' -type f | head -1)
            if [ -z "$wasm" ]; then
              echo "ERROR: no .wasm found for plugin ${name}"
              exit 1
            fi
            cp "$wasm" "../../build/plugins/${name}.wasm"
            echo "Built: ${name}.wasm ($(stat --printf='%s' "../../build/plugins/${name}.wasm") bytes)"
            cd ../..
          done
          echo "=== All plugins ==="
          ls -la build/plugins/

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: osg-plugins
          path: build/plugins/*.wasm

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.10.1

  vet:
    name: Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: go vet
        run: |
          # Run vet on all packages except plugin/sdk which uses intentional
          # unsafe.Pointer conversions for WASM linear memory access.
          go vet $(go list ./... | grep -v /plugin/sdk)

  govulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build, build-plugins, lint, vet, govulncheck]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: osg-*

      - name: Collect release assets
        run: |
          echo "=== Downloaded artifacts ==="
          find artifacts -type f -ls
          mkdir -p release
          find artifacts -name '*.tar.gz' -exec cp {} release/ \;
          find artifacts -name '*.wasm' -exec cp {} release/ \;
          cd release
          sha256sum *.tar.gz *.wasm > checksums.txt
          echo "=== Release assets ==="
          ls -la

      - name: Generate release notes
        id: notes
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          PREV_TAG=$(git tag --sort=-v:refname | grep -A1 "^${TAG}$" | tail -1)
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "$TAG" ]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          {
            echo "notes<<NOTES_EOF"
            echo "## Changes"
            echo ""
            git log --oneline "${PREV_TAG}..${TAG}" | head -50
            echo ""
            echo "## Binaries"
            echo ""
            echo "| Platform | Architecture | File |"
            echo "|----------|-------------|------|"
            echo "| Linux | amd64 | osg-linux-amd64.tar.gz |"
            echo "| Linux | arm64 | osg-linux-arm64.tar.gz |"
            echo "| macOS | amd64 | osg-darwin-amd64.tar.gz |"
            echo "| macOS | arm64 | osg-darwin-arm64.tar.gz |"
            echo "| Windows | amd64 | osg-windows-amd64.exe.tar.gz |"
            echo ""
            echo "## Plugins"
            echo ""
            echo "WASM plugins are included as release assets (\`.wasm\` files)."
            echo "Install with: \`osg plugin install <name>\` or download manually to \`plugins/\`."
            echo ""
            echo "Verify checksums with: \`sha256sum -c checksums.txt\`"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: ${{ steps.notes.outputs.tag }}
          body: ${{ steps.notes.outputs.notes }}
          files: release/*
          draft: false
          prerelease: false
