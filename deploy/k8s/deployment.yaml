# deploy/k8s/deployment.yaml — OSG API server deployment
#
# Runs the osg api command with config from ConfigMap
# and persistent storage from PVC.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: osg
  labels:
    app: osg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: osg
  template:
    metadata:
      labels:
        app: osg
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: osg
          image: osg:latest
          command: ["osg", "api", "--config", "/config/config.yaml"]
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: osg-config
        - name: data
          persistentVolumeClaim:
            claimName: osg-data
