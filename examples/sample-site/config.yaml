vault_path: ""
base_url: ""
default_language: es
theme: default
color_scheme: auto
content_dir: content
public_dir: public
templates_dir: templates
static_dir: ../../static
themes_dir: ../../themes
plugins_dir: plugins
plugins_enabled:
  - search
sass_dir: sass
content_layout: "{date}/{slug}"
include_drafts: false
compile_sass: false
summary_strategy: auto
site_feed: true
site_feed_limit: 20
image_optimization: true
image_quality: 80
image_widths: [640, 1200]
tui_prefix: space
tui_prefix_ms: 600
serve_watch: true
serve_live_reload: true
serve_debounce_ms: 300
build_incremental: true
build_cache_dir: .osg/cache
clean_public: true
doctor_profile: dev
logging:
  level: info
  format: json
taxonomies:
  - name: tags
    paginate_by: 10
    paginate_path: page
    feed: false
    render: true
  - name: area
    paginate_by: 10
    paginate_path: page
    feed: false
    render: true
  - name: type
    paginate_by: 10
    paginate_path: page
    feed: false
    render: true

# -----------------------------------------------------------------------------
# Sidebar widgets (homepage)
# -----------------------------------------------------------------------------
# Optional 3-column homepage layout. When sidebar_widgets is set the
# homepage gains a right sidebar with the listed widgets. At >=1400px
# viewport the widgets render in a sticky sidebar on the right; below
# 1400px they stack beneath the post list. Each widget self-hides when
# its data is missing.
#
# Available: author / newsletter / popular.
#
# Uncomment to enable. With only this minimal sample-site the `popular`
# widget would hide itself (no interactions DB / no view data).
#
# sidebar_widgets:
#   - author
#   - newsletter
# author: "Sample Author"
# author_bio: "Demo author for the OSG sample site."
# author_url: "https://example.com"
# social:
#   github: "https://github.com/example"
# newsletter_action: ""
