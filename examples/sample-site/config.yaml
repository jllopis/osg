vault_path: ""
base_url: ""
theme: default
content_dir: content
public_dir: public
templates_dir: templates
static_dir: ../../static
themes_dir: ../../themes
plugins_dir: plugins
plugins_enabled: []
sass_dir: sass
content_layout: "{date}/{slug}"
include_drafts: false
compile_sass: false
tui_prefix: space
tui_prefix_ms: 600
serve_watch: true
serve_live_reload: true
serve_debounce_ms: 300
build_incremental: true
build_cache_dir: .osg/cache
clean_public: true
logging:
  level: info
  format: json
taxonomies:
  - name: tags
    paginate_by: 10
    paginate_path: page
    feed: false
    render: true
  - name: area
    paginate_by: 10
    paginate_path: page
    feed: false
    render: true
  - name: type
    paginate_by: 10
    paginate_path: page
    feed: false
    render: true
