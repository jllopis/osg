<!doctype html>
<html lang="{{ .lang }}" data-color-scheme="{{ .config.color_scheme }}">
  <head>
    <title>{{ trans "not_found_title" }} &mdash; {{ if .config.site_title }}{{ .config.site_title }}{{ else }}OSG{{ end }}</title>
    {{ template "partials/head.html" . }}
  </head>
  <body>
    <div class="page">
      {{ template "partials/header.html" . }}

      <main id="main-content" class="container" role="main">
        <div class="not-found">
          <h1>404</h1>
          <p>{{ trans "not_found_text" }}</p>
          <a class="btn" href="{{ get_url "/" true false }}">&larr; {{ trans "back_to_home" }}</a>
        </div>
      </main>

      {{ template "partials/footer.html" . }}
    </div>
  </body>
</html>
