<a class="skip-link" href="#main-content">{{ trans "skip_to_content" }}</a>
<header class="site-header" role="banner">
  <div class="container">
    <a class="brand" href="{{ get_url "/" true false }}">{{ if .config.site_title }}{{ .config.site_title }}{{ else }}OSG{{ end }}</a>
    {{ if or .taxonomies .menu_pages }}
    <nav class="nav" aria-label="{{ trans "aria_main_nav" }}">
      {{ range $name, $data := .taxonomies }}
      <a href="{{ get_url (printf "/%s/" $name) true false }}">{{ $name }}</a>
      {{ end }}
      {{ range .menu_pages }}
      <a href="{{ .path }}">{{ .title }}</a>
      {{ end }}
    </nav>
    {{ end }}
    <div class="header-search">
      <input type="search" id="header-search-input" placeholder="{{ trans "nav.search" }}..." autocomplete="off" aria-label="{{ trans "nav.search" }}" />
      <div id="header-search-results" class="search-dropdown" aria-expanded="false"></div>
    </div>
  </div>
</header>
<script src="https://cdn.jsdelivr.net/npm/minisearch@7.1.0/dist/umd/index.min.js" defer></script>
<script src="/js/search.js" defer></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    if (typeof OSGSearch !== 'undefined') {
      new OSGSearch({
        inputSelector: '#header-search-input',
        resultsSelector: '#header-search-results',
        maxResults: 8,
        minChars: 2
      });
    }
  });
</script>
