version: 2

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: osg
    main: ./cmd/osg
    binary: osg
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X osg/internal/app.Version={{.Version}}
      - -X osg/internal/app.Commit={{.ShortCommit}}
      - -X osg/internal/app.Date={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "Merge pull request"

release:
  github:
    owner: jllopis
    name: osg
  draft: false
  prerelease: auto
